<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沙港训练场 · Mini CS</title>
    <link rel="stylesheet" href="style.css?v=arenas" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><i aria-hidden="true"></i> MINI CS</div>
        <span class="mode">单人训练</span
        ><button id="restart" class="quiet">↻　重新开始</button>
      </header>
      <nav id="map-nav" aria-label="选择作战场景"><span>作战场景</span></nav>
      <section id="arena" data-mode="ready" aria-label="沙港训练场">
        <canvas
          id="world"
          width="1280"
          height="720"
          aria-hidden="true"
        ></canvas>
        <canvas
          id="stage"
          width="1280"
          height="720"
          aria-label="训练场第一人称视野"
          tabindex="0"
        ></canvas>
        <div class="hud" aria-label="对局状态">
          <div class="round">
            <span>剩余时间 <b id="timer"></b></span
            ><span>目标 <b id="enemies"></b></span>
          </div>
          <div class="health">
            <small>生命</small><b id="hp"></b>
            <div class="track"><i id="health-bar"></i></div>
          </div>
          <div class="ammo">
            <small>弹药</small><b id="ammo"></b> <span id="reserve"></span>
          </div>
        </div>
        <div id="message" class="brief">
          <div class="brief-body">
            <div class="eyebrow" id="mission-label">训练地图 / SANDPORT</div>
            <h1 id="mission-title">沙港训练场</h1>
            <p id="mission-info">在 100 秒内清除场内的 8 个目标。</p>
            <button id="start">
              进入训练 <span aria-hidden="true">→</span>
            </button>
            <details id="controls">
              <summary>操作说明</summary>
              <p>
                <kbd>W A S D</kbd> 移动　<kbd>Shift</kbd> 冲刺　<kbd>R</kbd>
                换弹<br />移动鼠标转向，左键射击，<kbd>Esc</kbd>
                暂停。<br />小地图上方对应你的朝向。圆点是地面敌人，三角是已发现的墙头守卫。
              </p>
            </details>
            <p id="input-error" role="status"></p>
          </div>
        </div>
      </section>
      <footer>
        <span><i></i><span id="current-map">沙港训练场</span></span
        ><span>键盘 + 鼠标 <em>/</em> <kbd>ESC</kbd> 暂停</span>
      </footer>
    </main>
    <img
      hidden
      alt=""
      id="harbor-materials"
      src="assets/harbor-materials.jpg"
    />
    <img
      hidden
      alt=""
      id="training-blaster"
      src="assets/training-blaster.webp"
    />
    <img hidden alt="" id="training-opponent" src="assets/field-uniform.webp" />
    <script src="arenas.js?v=1"></script>
    <script src="arena-scenery.js?v=1"></script>
    <script src="depot.js?v=arenas"></script>
    <script src="equipment.js"></script>
    <script src="opponent-motion.js?v=rooftop-radar"></script>
    <script src="opponent-model.js?v=rooftop-radar"></script>
    <script src="smoke.js?v=1"></script>
    <script src="game.js?v=arenas"></script>
  </body>
</html>
